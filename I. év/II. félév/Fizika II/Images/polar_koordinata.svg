<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 680 460"
   width="100%"
   height="100%"
   version="1.1"
   id="svg21"
   sodipodi:docname="polar_koordinata.svg"
   inkscape:export-filename="polar_koordinata.png"
   inkscape:export-xdpi="96"
   inkscape:export-ydpi="96"
   inkscape:version="1.4.4 (dcaf3e7d9e, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview21"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="0.01"
     inkscape:cx="350"
     inkscape:cy="200"
     inkscape:window-width="456"
     inkscape:window-height="497"
     inkscape:window-x="1437"
     inkscape:window-y="556"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg21" />
  <!-- Háttér -->
  <rect
     width="680"
     height="460"
     fill="#121212"
     rx="10"
     id="rect1" />
  <!-- Cím -->
  <text
     x="340"
     y="32"
     fill="#FFFFFF"
     font-family="sans-serif"
     font-size="16"
     font-weight="bold"
     text-anchor="middle"
     id="text1">Elektron mozgása mágneses térben (3D Polárkoordináták)</text>
  <defs
     id="defs4">
    <!-- Nyílhegyek -->
    <marker
       id="arrowAxis"
       viewBox="0 0 10 10"
       refX="6"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M 0 1.5 L 10 5 L 0 8.5 z"
         fill="#78909C"
         id="path1" />
    </marker>
    <marker
       id="arrowB"
       viewBox="0 0 10 10"
       refX="6"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M 0 1.5 L 10 5 L 0 8.5 z"
         fill="#29B6F6"
         id="path2" />
    </marker>
    <marker
       id="arrowV"
       viewBox="0 0 10 10"
       refX="6"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M 0 1.5 L 10 5 L 0 8.5 z"
         fill="#81C784"
         id="path3" />
    </marker>
    <marker
       id="arrowF"
       viewBox="0 0 10 10"
       refX="6"
       refY="5"
       markerWidth="6"
       markerHeight="6"
       orient="auto-start-reverse">
      <path
         d="M 0 1.5 L 10 5 L 0 8.5 z"
         fill="#FFD54F"
         id="path4" />
    </marker>
  </defs>
  <!-- KOORDINÁTA-TENGELYEK (3D Izometrikus skicc) -->
  <!-- Origó: (300, 270) -->
  <!-- Oz tengely (Felfelé) -->
  <line
     x1="300"
     y1="270"
     x2="300"
     y2="50"
     stroke="#78909C"
     stroke-width="2"
     marker-end="url(#arrowAxis)"
     id="line4" />
  <text
     x="285"
     y="55"
     fill="#78909C"
     font-family="sans-serif"
     font-size="15"
     font-weight="bold"
     id="text4">Oz</text>
  <!-- Ox tengely (Balra-le) -->
  <line
     x1="300"
     y1="270"
     x2="150"
     y2="365"
     stroke="#78909C"
     stroke-width="2"
     marker-end="url(#arrowAxis)"
     id="line5" />
  <text
     x="135"
     y="380"
     fill="#78909C"
     font-family="sans-serif"
     font-size="15"
     font-weight="bold"
     id="text5">Ox</text>
  <!-- Oy tengely (Jobbra) -->
  <line
     x1="300"
     y1="270"
     x2="540"
     y2="270"
     stroke="#78909C"
     stroke-width="2"
     marker-end="url(#arrowAxis)"
     id="line6" />
  <text
     x="550"
     y="275"
     fill="#78909C"
     font-family="sans-serif"
     font-size="15"
     font-weight="bold"
     id="text6">Oy</text>
  <!-- TENGELY HOSSZABBÍTÁSOK (Szaggatott) -->
  <line
     x1="300"
     y1="270"
     x2="300"
     y2="330"
     stroke="#455A64"
     stroke-width="1.5"
     stroke-dasharray="4,4"
     id="line7" />
  <line
     x1="300"
     y1="270"
     x2="450"
     y2="175"
     stroke="#455A64"
     stroke-width="1.5"
     stroke-dasharray="4,4"
     id="line8" />
  <line
     x1="300"
     y1="270"
     x2="120"
     y2="270"
     stroke="#455A64"
     stroke-width="1.5"
     stroke-dasharray="4,4"
     id="line9" />
  <!-- MÁGNESES INDUKCIÓ VEKTOR (B = B k) -->
  <line
     x1="300"
     y1="270"
     x2="300"
     y2="110"
     stroke="#29B6F6"
     stroke-width="3.5"
     marker-end="url(#arrowB)"
     id="line10" />
  <text
     x="315"
     y="125"
     fill="#29B6F6"
     font-family="sans-serif"
     font-size="16"
     font-weight="bold"
     id="text10">B = B·k</text>
  <!-- PROJEKCIÓK ÉS SEGÉDVONALAK A SEBESSÉGVEKTORHOZ (v) -->
  <!-- v vetülete az xy síkon (v_xy) -->
  <line
     x1="300"
     y1="270"
     x2="395"
     y2="330"
     stroke="#81C784"
     stroke-width="1.5"
     stroke-dasharray="3,3"
     id="line11" />
  <!-- Függőleges vetítősugár az xy sík vetületétől a v vektor hegyébe -->
  <line
     x1="395"
     y1="330"
     x2="395"
     y2="180"
     stroke="#81C784"
     stroke-width="1.5"
     stroke-dasharray="3,3"
     id="line12" />
  <!-- Vízszintes segédvonal a z tengelytől -->
  <line
     x1="300"
     y1="120"
     x2="395"
     y2="180"
     stroke="#81C784"
     stroke-width="1"
     stroke-dasharray="2,2"
     id="line13" />
  <!-- SEBESSÉGVEKTOR (v) -->
  <line
     x1="300"
     y1="270"
     x2="395"
     y2="180"
     stroke="#81C784"
     stroke-width="3.5"
     marker-end="url(#arrowV)"
     id="line14" />
  <text
     x="410"
     y="180"
     fill="#81C784"
     font-family="sans-serif"
     font-size="16"
     font-weight="bold"
     id="text14">v (400 km/s)</text>
  <!-- LORENTZ-ERŐ VEKTOR (F) az xy síkban -->
  <!-- F = -e (v x B) -> az xy síkban -x és +y irányok közé mutat -->
  <line
     x1="300"
     y1="270"
     x2="455"
     y2="210"
     stroke="#FFD54F"
     stroke-width="3.5"
     marker-end="url(#arrowF)"
     id="line15" />
  <text
     x="470"
     y="210"
     fill="#FFD54F"
     font-family="sans-serif"
     font-size="16"
     font-weight="bold"
     id="text15">F = q(v × B)</text>
  <!-- ELEKTRON (Kezdőpontban) -->
  <circle
     cx="300"
     cy="270"
     r="7"
     fill="#E57373"
     stroke="#FFFFFF"
     stroke-width="1.5"
     id="circle15" />
  <text
     x="282"
     y="285"
     fill="#E57373"
     font-family="sans-serif"
     font-size="12"
     font-weight="bold"
     id="text16">e-</text>
  <!-- SZÖGEK JELÖLÉSE -->
  <!-- theta szög (v és Oz között = 45°) -->
  <path
     d="M 300 210 A 60 60 0 0 1 332 238"
     fill="none"
     stroke="#FFB74D"
     stroke-width="2"
     id="path16" />
  <text
     x="325"
     y="215"
     fill="#FFB74D"
     font-family="sans-serif"
     font-size="13"
     font-weight="bold"
     id="text17">θ = 45°</text>
  <!-- phi szög (Ox és v_xy között = 45°) -->
  <path
     d="M 240 308 A 70 70 0 0 0 338 297"
     fill="none"
     stroke="#FFB74D"
     stroke-width="2"
     id="path17" />
  <text
     x="270"
     y="325"
     fill="#FFB74D"
     font-family="sans-serif"
     font-size="13"
     font-weight="bold"
     id="text18">φ = 45°</text>
  <!-- Derékszög jelölése F és v_xy között -->
  <path
     d="M 335 282 L 345 262 L 320 252"
     fill="none"
     stroke="#FFD54F"
     stroke-width="1.2"
     id="path18" />
  <!-- JELMAGYARÁZAT DOBOZ -->
  <rect
     x="40"
     y="370"
     width="600"
     height="75"
     rx="6"
     fill="#1E1E1E"
     stroke="#333"
     id="rect18" />
  <text
     x="55"
     y="392"
     fill="#81C784"
     font-family="sans-serif"
     font-size="12"
     id="text19">• v = (200 i + 200 j + 282.8 k) km/s  [v_x = v·sinθ·cosφ, v_y = v·sinθ·sinφ, v_z = v·cosθ]</text>
  <text
     x="55"
     y="412"
     fill="#29B6F6"
     font-family="sans-serif"
     font-size="12"
     id="text20">• B = B k  (mágneses tér az Oz tengely mentén)</text>
  <text
     x="55"
     y="432"
     fill="#FFD54F"
     font-family="sans-serif"
     font-size="12"
     font-weight="bold"
     id="text21">• F = q(v × B) = B · (-3.204·10⁻¹⁴ i + 3.204·10⁻¹⁴ j) N  ⇒  |F| = 4.531·10⁻¹⁴ · B [N]</text>
</svg>
